[project]
name = "bobine-studio"
version = "0.1.0"
description = "Bobine : studio local de videos verticales generees par IA (video unique ou mini-serie)."
requires-python = ">=3.11"
dependencies = [
    "arabic-reshaper>=3.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "imageio-ffmpeg>=0.5",
    "pillow>=10.1",
    "python-bidi>=0.6",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
